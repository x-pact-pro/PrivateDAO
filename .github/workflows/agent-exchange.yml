name: Agent Exchange

on:
  push:
    branches: [main, rebrand/enterprise-white]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agent-exchange-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/agent-exchange-lambda
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.21.1"
          cache: npm
          cache-dependency-path: integrations/agent-exchange-lambda/package-lock.json

      - name: Install Lambda dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Syntax and tests
        run: npm run lint && npm test && npm run smoke

      - name: Build deployment package and verify bundled assets
        run: npm run package -- /tmp/privatedao-agent-exchange.zip

      - name: Verify browser payment bundles are local
        run: '! grep -RInE "(esm\\.sh|cdn\\.jsdelivr\\.net)" src assets scripts/browser'

      - name: Verify runtime dependencies
        run: npm ls @aws-sdk/client-dynamodb @aws-sdk/lib-dynamodb mongodb --depth=0

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Check for committed secrets
        run: |
          ! grep -RInE '(BEGIN (RSA|OPENSSH|EC|PGP) PRIVATE KEY|AKIA[0-9A-Z]{16}|BOT_TOKEN=|ALCHEMY_API_KEY=)' \
            --exclude-dir=.git --exclude-dir=node_modules .

name: Build website

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pages.yml"
      - "package.json"
      - "package-lock.json"
      - "apps/web/**"
      - "scripts/build-web-mirror-bundle.sh"
      - "scripts/build-github-pages-redirect.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.21.1"

      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps

      - name: Install web dependencies
        run: npm --prefix apps/web ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps

      - name: Build root web mirror bundle
        run: npm run web:bundle:root

      - name: Build GitHub Pages redirect artifact
        run: node scripts/build-github-pages-redirect.mjs

      - name: Upload website build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: privatedao-website-build
          path: ./dist/github-pages-redirect

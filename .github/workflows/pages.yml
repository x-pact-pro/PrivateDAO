name: Build website

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pages.yml"
      - "package.json"
      - "package-lock.json"
      - "apps/web/**"
      - "scripts/build-web-mirror-bundle.sh"
      - "scripts/build-github-pages-redirect.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.21.1"

      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps

      - name: Install web dependencies
        run: npm --prefix apps/web ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps

      - name: Build root web mirror bundle
        run: npm run web:bundle:root

      - name: Build GitHub Pages redirect artifact
        run: node scripts/build-github-pages-redirect.mjs

      - name: Upload website build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: privatedao-website-build
          path: ./dist/github-pages-redirect

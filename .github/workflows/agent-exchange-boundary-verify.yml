name: Agent Exchange Boundary Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-exchange-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify dedicated source ownership
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/agent-exchange-integration-boundary.md
          test ! -e integrations/agent-exchange-lambda
          test ! -e plugins/privatedao-agent-exchange
          test ! -e marketplace/alibaba/agent-exchange
          test ! -e marketplace/alibaba/privatepay
          test ! -e .github/workflows/agent-exchange.yml
          test ! -e .github/workflows/agent-exchange-deploy.yml

      - name: Verify public Agent Exchange boundary
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --max-time 15 https://agents.privatedao.org/api/health)"
          status="$(curl --fail --silent --show-error --max-time 15 https://agents.privatedao.org/api/privatepay/status)"
          printf '%s\n' "$health" | grep -q 'mainnet-verified'
          printf '%s\n' "$status" | grep -q '"operational":true'

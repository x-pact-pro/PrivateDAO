name: PDAO Wallet Android Beta
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/pdao-wallet-android/**"
      - ".github/workflows/pdao-wallet-android-beta.yml"
  push:
    branches:
      - "feature/pdao-wallet-android-beta"
    paths:
      - "apps/pdao-wallet-android/**"
      - ".github/workflows/pdao-wallet-android-beta.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build beta APK
        working-directory: apps/pdao-wallet-android
        run: |
          gradle --version
          gradle --no-daemon :app:assembleDebug
      - name: Upload Android beta
        uses: actions/upload-artifact@v4
        with:
          name: PDAO-Wallet-Android-Beta-0.1.0
          path: apps/pdao-wallet-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

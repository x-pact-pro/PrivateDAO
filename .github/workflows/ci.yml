name: CI

on:
  push:
    branches: [main, rebrand/enterprise-white]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.21.1'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Install Solana CLI
        run: |
          for attempt in 1 2 3; do
            rm -f "$RUNNER_TEMP/solana-install.sh"
            if curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 --proto '=https' --tlsv1.2 \
              https://release.anza.xyz/stable/install -o "$RUNNER_TEMP/solana-install.sh" \
              && timeout --signal=TERM --kill-after=30s 5m sh "$RUNNER_TEMP/solana-install.sh" \
              && "$HOME/.local/share/solana/install/active_release/bin/solana" --version; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Solana CLI installation failed after ${attempt} attempts" >&2
              exit 1
            fi
            echo "Solana CLI installation failed on attempt ${attempt}; retrying" >&2
            sleep $((attempt * 10))
          done
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: |
          # Use the official immutable Anchor 1.0.1 Linux release and verify its
          # published digest instead of compiling the CLI during every CI run.
          mkdir -p "$HOME/.local/bin"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            --proto '=https' --tlsv1.2 \
            https://github.com/otter-sec/anchor/releases/download/v1.0.1/anchor-1.0.1-x86_64-unknown-linux-gnu \
            -o "$HOME/.local/bin/anchor"
          echo "8427407220983e9847abcc1e1767dbc6654288957535a5d653f449860871a8df  $HOME/.local/bin/anchor" | sha256sum --check --strict
          chmod 0755 "$HOME/.local/bin/anchor"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          anchor --version

      - name: Install dependencies
        run: |
          test -f "$GITHUB_WORKSPACE/package.json"
          for attempt in 1 2 3; do
            rm -rf "$GITHUB_WORKSPACE/node_modules"
            if npm ci --prefix "$GITHUB_WORKSPACE" --include=dev --include=optional --ignore-scripts --no-audit --no-fund --legacy-peer-deps; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "npm install failed after ${attempt} attempts" >&2
              exit 1
            fi
            echo "npm install failed on attempt ${attempt}; retrying" >&2
            sleep $((attempt * 10))
          done
          test -d "$GITHUB_WORKSPACE/node_modules"
          test -x "$GITHUB_WORKSPACE/node_modules/.bin/ts-node"
          test -x "$GITHUB_WORKSPACE/node_modules/.bin/tsc"
          # npm 11 may rewrite the unrelated Yarn v1 lockfile as a side effect
          # of npm ci. The repository source of truth for this job is package-lock.json.
          git restore --source=HEAD --worktree -- yarn.lock

      - name: Create local test wallet
        run: |
          mkdir -p "$HOME/.config/solana"
          if [ ! -f "$HOME/.config/solana/id.json" ]; then
            solana-keygen new --outfile "$HOME/.config/solana/id.json" --no-bip39-passphrase --silent
          fi

      - name: Verify tools
        run: bash scripts/verify.sh tools

      - name: Anchor build
        run: bash scripts/verify.sh build

      - name: Anchor test
        run: bash scripts/verify.sh test

      - name: Non-real-code scan
        run: bash scripts/verify.sh scan

      - name: Runtime kernel typecheck
        run: npm run typecheck:runtime

      - name: Verify enterprise and Agent Exchange boundary
        run: npm run test:enterprise-boundary

      - name: EVM foundation tests
        run: npm run test:runtime:evm-foundation

      - name: Verify legacy route archive boundary
        run: npm run verify:legacy-route-archive

      - name: Verify repository lockfiles remain stable
        run: |
          git diff --exit-code -- Cargo.lock yarn.lock
          sha256sum Cargo.lock yarn.lock

      - name: Unified review and ops verification
        run: npm run verify:all

      - name: Artifact freshness
        run: npm run verify:artifact-freshness

name: Devnet Canary

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.21.1"
          cache: "yarn"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build wallet compatibility matrix
        run: npm run build:wallet-matrix

      - name: Build Devnet canary
        run: npm run build:devnet-canary

      - name: Verify runtime canary artifacts
        run: |
          npm run verify:wallet-matrix
          npm run verify:devnet-canary

      - name: Upload canary artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: devnet-canary-artifacts
          path: |
            docs/wallet-compatibility-matrix.generated.md
            docs/wallet-compatibility-matrix.generated.json
            docs/devnet-canary.generated.md
            docs/devnet-canary.generated.json
